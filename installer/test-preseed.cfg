# test-installer.sh's answers to the questions installer/preseed.cfg
# leaves to the user, for an install that runs by itself (priority=critical
# on the command line).  Root's password is "next", as on the Debian image.
# In low memory mode, which every NeXT is in, the installer asks for the
# location at critical priority.
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string next
d-i netcfg/hostname string next
d-i netcfg/get_domain string
d-i mirror/http/proxy string
d-i passwd/root-password password next
d-i passwd/root-password-again password next
d-i passwd/make-user boolean false
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean false
d-i next-partitioner/disk select sda
d-i next-partitioner/confirm boolean true
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string fastfetch
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
