# The NeXT installer's defaults, loaded at start-up by next-partitioner's
# S29next-preseed, before any /preseed.cfg in the initrd.  Only what a NeXT
# install always needs is answered here; the installer asks the rest.  More
# can be preseeded from the command line (key=value, or preseed/url=) as
# for any debian-installer.

# m68k is a Debian Ports architecture: unstable from deb.debian.org's
# debian-ports, signed with debian-ports-archive-keyring.  The mirror list
# knows only the main archive.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian-ports
d-i mirror/suite string unstable
d-i mirror/udeb/suite string unstable

# The initrd carries every installer component (installer/packages), and
# the kernel has no modules: nothing to download.
d-i anna/standard_modules boolean false
d-i anna/no_kernel_modules boolean true
d-i hw-detect/load_firmware boolean false

# On a NeXT the installer is always in low memory mode, and says so before
# it starts on the consoles: on one only, the serial port, where it would
# wait for the user while the screen shows nothing.
d-i lowmem/low note

# The kernel is ours, installed by next-installer: none from the archive,
# whose m68k kernels don't support the NeXT.
d-i base-installer/kernel/image string none

# The new system gets its network from systemd-networkd, as next68k-linux's
# Debian image does (next-installer): dhcpcd, which ifupdown would use, is
# killed by its own seccomp filter on m68k ("Bad system call").
d-i netcfg/target_network_config select loopback

# Debian Ports has no security or updates suites.
d-i apt-setup/services-select multiselect
