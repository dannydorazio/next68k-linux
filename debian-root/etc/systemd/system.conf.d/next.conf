# The NeXT is slow.  On the 68030 NeXT Computer, about a third as fast as
# the 68040 machines, udev takes about 16 minutes at boot to get through
# the devices, so the serial console (ttyPZ0) and the disks show up late,
# and services starting meanwhile, such as journald, take minutes.
# systemd's defaults of 90 seconds would give up on them, and kill and
# restart the services in a loop.
[Manager]
DefaultDeviceTimeoutSec=30min
DefaultTimeoutStartSec=30min
