# X on the NeXT.  Only the first display is used: with a NeXTdimension
# that's the board's (card0), and the built-in one isn't added as a second
# GPU.
Section "ServerFlags"
	Option	"AutoAddGPU" "false"
EndSection

# The NeXTdimension's own driver (xorg-nextdimension), which draws with the
# board's i860.  Without it, X uses modesetting as on the built-in displays.
Section "OutputClass"
	Identifier	"NeXTdimension"
	MatchDriver	"nextdimension"
	Driver		"nextdimension"
EndSection

# Otherwise modesetting, without glamor, which would draw through Mesa's
# software OpenGL and take over a minute just to start on a 68040.  (An
# OutputClass without a Driver ends X's list of drivers to try.)
Section "OutputClass"
	Identifier	"NeXT displays"
	Driver		"modesetting"
	Option		"AccelMethod" "none"
EndSection
