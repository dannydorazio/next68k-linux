# X on the NeXT.  glamor would draw through Mesa's software OpenGL, which
# takes over a minute just to start on a 68040, so draw without it.  Only
# the first display is used: with a NeXTdimension that's the board's
# (card0), and the built-in one isn't added as a second GPU.
Section "ServerFlags"
	Option	"AutoAddGPU" "false"
EndSection

Section "Device"
	Identifier	"NeXT display"
	Driver		"modesetting"
	Option		"AccelMethod" "none"
EndSection
